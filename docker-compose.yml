version: '3.8'

services:
  payment-dashboard-api:
    build: .
    container_name: payment-dashboard-api
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=8000
    volumes:
      - ./sample_payments.csv:/app/sample_payments.csv:ro
    restart: unless-stopped
    networks:
      - payment-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

networks:
  payment-network:
    driver: bridge
